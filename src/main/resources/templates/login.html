<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark"><title>Connexion · ParkFlow</title>
    <script>!function(){try{var t=localStorage.getItem('parking-theme')||'auto';document.documentElement.setAttribute('data-bs-theme',t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t)}catch(e){}}()</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/theme.css}" href="/css/theme.css" rel="stylesheet">
</head>
<body class="auth-page d-flex align-items-center min-vh-100 py-4">
    <main class="container"><div class="auth-card card mx-auto"><div class="card-body p-4 p-sm-5"><header class="text-center mb-4"><span class="auth-brand-mark rounded-4 d-inline-flex align-items-center justify-content-center fs-2 mb-3"><i class="bi bi-p-circle-fill" aria-hidden="true"></i></span><p class="text-primary fw-semibold small text-uppercase mb-1">ParkFlow</p><h1 class="h3 mb-2">Bon retour parmi nous</h1><p class="text-body-secondary mb-0">Connectez-vous pour gérer votre parking.</p></header>
        <div th:if="${param.error}" class="alert alert-danger d-flex gap-2 align-items-start" role="alert"><i class="bi bi-exclamation-octagon-fill mt-1" aria-hidden="true"></i><span><strong>Connexion impossible.</strong><br>Email ou mot de passe incorrect.</span></div>
        <div th:if="${param.logout}" class="alert alert-info d-flex gap-2 align-items-center" role="status"><i class="bi bi-check-circle-fill" aria-hidden="true"></i>Vous avez été déconnecté avec succès.</div>
        <form th:action="@{/login}" method="post"><div class="mb-3"><label for="username" class="form-label fw-medium">Adresse e-mail</label><div class="input-group"><span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span><input type="email" class="form-control" id="username" name="username" placeholder="nom@exemple.com" autocomplete="username" required autofocus></div></div><div class="mb-4"><label for="password" class="form-label fw-medium">Mot de passe</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span><input type="password" class="form-control" id="password" name="password" placeholder="Votre mot de passe" autocomplete="current-password" required></div></div><button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Se connecter</button></form>
        <p class="auth-footer small text-center mb-0 mt-4"><i class="bi bi-shield-check me-1" aria-hidden="true"></i>Accès sécurisé à votre espace parking</p>
    </div></div></main>
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
</body>
</html>
