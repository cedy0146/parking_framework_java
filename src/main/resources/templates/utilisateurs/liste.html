<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent" class="page-enter">

    <header class="page-header">
        <div>
            <p class="page-eyebrow">Administration</p>
            <h1 class="page-title"><span class="hl">Utilisateurs<svg class="hl-mark" viewBox="0 0 260 70" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="130" cy="35" rx="124" ry="30"></ellipse></svg></span></h1>
            <p class="page-subtitle">Comptes, rôles et coordonnées des utilisateurs.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/utilisateurs/nouveau}" class="btn btn-primary" data-crud-open data-crud-title="Nouvel utilisateur">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>Nouvel utilisateur
            </a>
        </div>
    </header>

    <!-- Filtres -->
    <section class="filter-bar" aria-label="Rechercher un utilisateur">
        <form th:action="@{/utilisateurs}" method="get" class="row g-3 align-items-end">
            <div class="col-6 col-md-4">
                <label class="form-label" for="filtre-nom">Nom</label>
                <input type="text" class="form-control" id="filtre-nom" name="nom" th:value="${nom}" placeholder="Rechercher par nom...">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="filtre-role">Rôle</label>
                <select class="form-select" id="filtre-role" name="role">
                    <option value="">Tous les rôles</option>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == role}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-search" aria-hidden="true"></i>Filtrer
                </button>
            </div>
        </form>
    </section>

    <!-- Liste -->
    <section class="card" aria-label="Liste des utilisateurs">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nom</th>
                            <th scope="col">Prénom</th>
                            <th scope="col">Email</th>
                            <th scope="col">Téléphone</th>
                            <th scope="col">Rôle</th>
                            <th scope="col" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${utilisateurs.content}">
                            <td class="cell-muted" th:text="${u.id}"></td>
                            <td class="cell-strong" th:text="${u.nom}"></td>
                            <td th:text="${u.prenom}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.telephone}"></td>
                            <td><span class="badge bg-secondary" th:text="${u.role}"></span></td>
                            <td class="text-end">
                                <div class="row-actions" aria-label="Actions sur l'utilisateur">
                                    <a th:href="@{/utilisateurs/modifier/{id}(id=${u.id})}" class="icon-btn" aria-label="Modifier l'utilisateur" title="Modifier" data-crud-open data-crud-title="Modifier l'utilisateur">
                                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                                    </a>
                                    <form th:action="@{/utilisateurs/supprimer/{id}(id=${u.id})}" method="post" class="d-inline" data-crud-confirm="Supprimer définitivement cet utilisateur ?">
                                        <button type="submit" class="icon-btn icon-btn--danger" aria-label="Supprimer l'utilisateur" title="Supprimer">
                                            <i class="bi bi-trash3" aria-hidden="true"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${utilisateurs.content.isEmpty()}">
                            <td colspan="7" class="table-empty">Aucun utilisateur trouvé.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}" class="p-3" aria-label="Pagination des utilisateurs">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/utilisateurs(page=${currentPage - 1}, nom=${nom}, role=${role})}">Précédent</a></li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/utilisateurs(page=${i}, nom=${nom}, role=${role})}" th:text="${i + 1}"></a></li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/utilisateurs(page=${currentPage + 1}, nom=${nom}, role=${role})}">Suivant</a></li>
                </ul>
            </nav>
        </div>
    </section>

</div>
</body>
</html>
