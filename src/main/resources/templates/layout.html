<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="light dark">
    <title th:text="${pageTitle != null ? pageTitle + ' - Parking' : 'Parking Management'}">Parking</title>
    <script>!function(){try{var t=localStorage.getItem('parking-theme')||'auto';document.documentElement.setAttribute('data-bs-theme',t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t)}catch(e){}}()</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/theme.css}" href="/css/theme.css" rel="stylesheet">
</head>
<body>
<div class="d-flex min-vh-100">
    <aside class="app-sidebar d-none d-md-flex flex-column flex-shrink-0 p-3"><a class="app-brand d-flex align-items-center gap-2 mb-4 text-decoration-none" th:href="@{/accueil}"><span class="app-brand-mark d-inline-flex align-items-center justify-content-center rounded-3"><i class="bi bi-p-circle-fill" aria-hidden="true"></i></span><span class="fs-5 fw-semibold">ParkFlow</span></a><nav class="app-nav nav nav-pills flex-column gap-1" aria-label="Navigation principale">
        <a class="nav-link" th:href="@{/accueil}"><i class="bi bi-grid-1x2-fill me-2" aria-hidden="true"></i>Tableau de bord</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')" th:href="@{/places/plan}"><i class="bi bi-grid-3x3-gap-fill me-2" aria-hidden="true"></i>Plan du parking</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')" th:href="@{/places}"><i class="bi bi-pin-map-fill me-2" aria-hidden="true"></i>Places</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','USER')" th:href="@{/reservations}"><i class="bi bi-calendar-check-fill me-2" aria-hidden="true"></i>Réservations</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')" th:href="@{/entrees-sorties}"><i class="bi bi-arrow-left-right me-2" aria-hidden="true"></i>Entrées / sorties</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/abonnements}"><i class="bi bi-credit-card-2-front-fill me-2" aria-hidden="true"></i>Abonnements</a><a class="nav-link" sec:authorize="hasRole('USER')" th:href="@{/abonnements/mon-abonnement}"><i class="bi bi-credit-card-2-front-fill me-2" aria-hidden="true"></i>Mon abonnement</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')" th:href="@{/vehicules}"><i class="bi bi-car-front-fill me-2" aria-hidden="true"></i>Véhicules</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/utilisateurs}"><i class="bi bi-people-fill me-2" aria-hidden="true"></i>Utilisateurs</a>
    </nav><div class="mt-auto pt-3 border-top border-secondary"><a class="app-nav nav-link d-block" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Déconnexion</a></div></aside>
    <div class="app-main d-flex flex-column flex-grow-1"><header class="app-header sticky-top border-bottom"><nav class="navbar px-3 px-lg-4 py-3" aria-label="Barre d'outils"><button class="btn btn-outline-secondary d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNavigation" aria-controls="mobileNavigation" aria-label="Ouvrir le menu"><i class="bi bi-list fs-5" aria-hidden="true"></i></button><span class="navbar-text fw-semibold text-body ms-2">Gestion de parking</span><div class="ms-auto dropdown"><button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Changer le thème"><i class="bi bi-circle-half me-1" aria-hidden="true"></i><span data-theme-label>Mode automatique</span></button><ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-label="Choix du thème"><li><button class="dropdown-item" type="button" data-theme-value="light"><i class="bi bi-sun-fill me-2" aria-hidden="true"></i>Mode clair</button></li><li><button class="dropdown-item" type="button" data-theme-value="dark"><i class="bi bi-moon-stars-fill me-2" aria-hidden="true"></i>Mode sombre</button></li><li><button class="dropdown-item" type="button" data-theme-value="auto"><i class="bi bi-circle-half me-2" aria-hidden="true"></i>Automatique</button></li></ul></div></nav></header>
        <main class="container-fluid p-3 p-lg-4" id="main-content"><div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert"><i class="bi bi-check-circle-fill me-2" aria-hidden="true"></i><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button></div><div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert"><i class="bi bi-exclamation-octagon-fill me-2" aria-hidden="true"></i><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button></div><div th:replace="~{:: pageContent}">Contenu</div></main>
    </div>
</div>
<div class="offcanvas offcanvas-start app-sidebar text-white d-md-none" tabindex="-1" id="mobileNavigation" aria-labelledby="mobileNavigationLabel"><div class="offcanvas-header"><h2 class="offcanvas-title fs-5 app-brand" id="mobileNavigationLabel"><i class="bi bi-p-circle-fill me-2" aria-hidden="true"></i>ParkFlow</h2><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fermer"></button></div><div class="offcanvas-body d-flex flex-column pt-0"><nav class="app-nav nav nav-pills flex-column gap-1" aria-label="Navigation mobile"><a class="nav-link" th:href="@{/accueil}">Tableau de bord</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')" th:href="@{/places/plan}">Plan du parking</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')" th:href="@{/places}">Places</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','USER')" th:href="@{/reservations}">Réservations</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')" th:href="@{/entrees-sorties}">Entrées / sorties</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/abonnements}">Abonnements</a><a class="nav-link" sec:authorize="hasRole('USER')" th:href="@{/abonnements/mon-abonnement}">Mon abonnement</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')" th:href="@{/vehicules}">Véhicules</a><a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/utilisateurs}">Utilisateurs</a></nav><a class="app-nav nav-link mt-auto" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Déconnexion</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
</body></html>
