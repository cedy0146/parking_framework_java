<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-car"></i> Véhicules</h2>
        <a th:href="@{/vehicules/nouveau}" class="btn btn-primary"><i class="fas fa-plus"></i> Nouveau véhicule</a>
    </div>
    <div class="card"><div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr><th>ID</th><th>Immatriculation</th><th>Marque</th><th>Modèle</th><th>Type</th><th>Propriétaire</th><th>Actions</th></tr></thead>
                <tbody>
                    <tr th:each="v : ${vehicules.content}">
                        <td th:text="${v.id}"></td><td><strong th:text="${v.immatriculation}"></strong></td><td th:text="${v.marque}"></td>
                        <td th:text="${v.modele}"></td><td><span class="badge bg-info" th:text="${v.typeVehicule}"></span></td><td th:text="${v.utilisateurNom}"></td>
                        <td><div class="d-inline-flex gap-3" aria-label="Actions sur le véhicule"><a th:href="@{/vehicules/modifier/{id}(id=${v.id})}" class="link-primary text-decoration-none" aria-label="Modifier" title="Modifier"><i class="bi bi-pencil-square" aria-hidden="true"></i></a><a th:href="@{/vehicules/supprimer/{id}(id=${v.id})}" class="link-danger text-decoration-none" onclick="return confirm('Supprimer ?')" aria-label="Supprimer" title="Supprimer"><i class="bi bi-trash3" aria-hidden="true"></i></a></div></td>
                    </tr>
                    <tr th:if="${vehicules.content.isEmpty()}"><td colspan="7" class="text-center text-muted">Aucun véhicule trouvé</td></tr>
                </tbody>
            </table>
        </div>
        <nav th:if="${totalPages > 1}"><ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/vehicules(page=${currentPage - 1})}">Précédent</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/vehicules(page=${i})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/vehicules(page=${currentPage + 1})}">Suivant</a></li>
        </ul></nav>
    </div></div>
</div>
</body>
</html>
