<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent">
    <h2 class="mb-4"><i class="fas fa-car"></i> <span th:text="${id != null ? 'Modifier le véhicule' : 'Nouveau véhicule'}"></span></h2>
    <div class="card"><div class="card-body">
        <form th:action="${id != null} ? @{/vehicules/modifier/{id}(id=${id})} : @{/vehicules/sauvegarder}" th:object="${vehicule}" method="post" class="row g-3">
            <div class="col-md-6"><label class="form-label">Immatriculation *</label><input type="text" class="form-control" th:field="*{immatriculation}" th:classappend="${#fields.hasErrors('immatriculation')} ? 'is-invalid'"><div class="invalid-feedback" th:if="${#fields.hasErrors('immatriculation')}" th:errors="*{immatriculation}"></div></div>
            <div class="col-md-6"><label class="form-label">Propriétaire *</label><select class="form-select" th:field="*{utilisateurId}" th:classappend="${#fields.hasErrors('utilisateurId')} ? 'is-invalid'"><option value="">-- Sélectionner --</option><option th:each="u : ${utilisateurs}" th:value="${u.id}" th:text="${u.prenom + ' ' + u.nom}"></option></select><div class="invalid-feedback" th:if="${#fields.hasErrors('utilisateurId')}" th:errors="*{utilisateurId}"></div></div>
            <div class="col-md-4"><label class="form-label">Marque *</label><input type="text" class="form-control" th:field="*{marque}" th:classappend="${#fields.hasErrors('marque')} ? 'is-invalid'"><div class="invalid-feedback" th:if="${#fields.hasErrors('marque')}" th:errors="*{marque}"></div></div>
            <div class="col-md-4"><label class="form-label">Modèle</label><input type="text" class="form-control" th:field="*{modele}"></div>
            <div class="col-md-4"><label class="form-label">Type</label><input type="text" class="form-control" th:field="*{typeVehicule}" placeholder="VOITURE, MOTO..."></div>
            <div class="col-12"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button> <a th:href="@{/vehicules}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Annuler</a></div>
        </form>
    </div></div>
</div>
</body>
</html>
