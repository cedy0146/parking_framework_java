<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232bb5a4'/%3E%3Cpath d='M11 24V8h6a5 5 0 0 1 0 10h-6' fill='none' stroke='%2304211d' stroke-width='2.5'/%3E%3C/svg%3E">
    <title>Accès refusé - ParkFlow</title>
    <script>
        (function () {
            var theme = 'dark';
            try {
                theme = localStorage.getItem('parkflow-theme') || 'dark';
            } catch (e) { /* stockage indisponible : mode sombre */ }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <meta name="theme-color" content="#0a0d10">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css?v=7}" href="/css/theme.css?v=7" rel="stylesheet">
    <script defer th:src="@{/js/animations.js}" src="/js/animations.js"></script>
    <script defer th:src="@{/js/theme.js?v=7}" src="/js/theme.js?v=7"></script>
</head>
<body class="auth-page d-flex align-items-center min-vh-100 py-4">
    <main class="container">
        <div class="auth-card auth-card--narrow card mx-auto">
            <div class="card-body p-4 p-sm-5 text-center">
                <span class="auth-brand-mark rounded-4 d-inline-flex align-items-center justify-content-center mb-3" aria-hidden="true">
                    <i class="bi bi-shield-lock-fill"></i>
                </span>
                <p class="page-eyebrow mb-1">Erreur 403</p>
                <h1 class="h4 mb-2">Accès refusé</h1>
                <p class="panel-subtitle mb-4">Vous n'avez pas les droits nécessaires pour accéder à cette page.</p>
                <a th:href="@{/accueil}" class="btn btn-primary">
                    <i class="bi bi-house-fill" aria-hidden="true"></i>Retour à l'accueil
                </a>
            </div>
        </div>
    </main>
</body>
</html>
