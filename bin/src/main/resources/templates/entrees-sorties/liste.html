<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-exchange-alt"></i> Entrées / Sorties</h2>
        <div><span class="badge bg-danger fs-6 me-2"><i class="fas fa-car"></i> <span th:text="${nbEnCours}">0</span> stationnés</span>
        <a th:href="@{/entrees-sorties/nouveau}" class="btn btn-success"><i class="fas fa-sign-in-alt"></i> Nouvelle entrée</a></div>
    </div>
    <div class="card mb-4"><div class="card-body">
        <form th:action="@{/entrees-sorties}" method="get" class="row g-3">
            <div class="col-md-3"><select class="form-select" name="enCours"><option value="">Tous</option><option value="true" th:selected="${enCoursFiltre == true}">En stationnement</option><option value="false" th:selected="${enCoursFiltre == false}">Terminées</option></select></div>
            <div class="col-md-2"><button type="submit" class="btn btn-outline-primary w-100"><i class="fas fa-search"></i> Filtrer</button></div>
        </form>
    </div></div>
    <div class="card"><div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr><th>ID</th><th>Véhicule</th><th>Place</th><th>Entrée</th><th>Sortie</th><th>Durée</th><th>Montant</th><th>Statut</th><th>Actions</th></tr></thead>
                <tbody>
                    <tr th:each="e : ${entreesSorties.content}">
                        <td th:text="${e.id}"></td><td th:text="${e.vehiculeImmatriculation}"></td><td th:text="${e.placeNumero}"></td>
                        <td th:text="${#temporals.format(e.dateHeureEntree, 'dd/MM HH:mm')}"></td>
                        <td th:text="${e.dateHeureSortie != null ? #temporals.format(e.dateHeureSortie, 'dd/MM HH:mm') : '-'}"></td>
                        <td th:text="${e.dureeFormatee ?: '-'}"></td><td th:text="${e.montantPaye != null ? e.montantPaye + ' Ar' : '-'}"></td>
                        <td><span class="badge" th:text="${e.enCours ? 'En cours' : 'Terminé'}" th:classappend="${e.enCours} ? 'bg-warning' : 'bg-success'"></span></td>
                        <td>
                            <a th:if="${e.enCours}" th:href="@{/entrees-sorties/sortie/{vehiculeId}(vehiculeId=${e.vehiculeId})}" class="btn btn-sm btn-danger"><i class="fas fa-sign-out-alt"></i></a>
                            <a th:if="${!e.enCours}" th:href="@{/entrees-sorties/facturation/{id}(id=${e.id})}" class="btn btn-sm btn-info"><i class="fas fa-receipt"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${entreesSorties.content.isEmpty()}"><td colspan="9" class="text-center text-muted">Aucune entrée/sortie</td></tr>
                </tbody>
            </table>
        </div>
        <nav th:if="${totalPages > 1}"><ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/entrees-sorties(page=${currentPage - 1})}">Précédent</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/entrees-sorties(page=${i})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/entrees-sorties(page=${currentPage + 1})}">Suivant</a></li>
        </ul></nav>
    </div></div>
</div>
</body>
</html>
