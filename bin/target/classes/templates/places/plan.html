<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<head><style>
    .place-cell { width: 90px; height: 90px; border-radius: 8px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; margin: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .libre { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; }
    .occupee { background: linear-gradient(135deg, #c0392b, #e74c3c); color: white; }
    .reservee { background: linear-gradient(135deg, #d68910, #f39c12); color: white; }
    .hors-service { background: linear-gradient(135deg, #7f8c8d, #95a5a6); color: white; }
</style></head>
<body>
<div th:fragment="pageContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-th"></i> Plan du Parking</h2>
        <a th:href="@{/places}" class="btn btn-secondary"><i class="fas fa-list"></i> Vue liste</a>
    </div>
    <div class="row mb-4">
        <div class="col-md-3"><div class="alert alert-success mb-0">Libres: <strong th:text="${placesLibres}">0</strong></div></div>
        <div class="col-md-3"><div class="alert alert-danger mb-0">Occupées: <strong th:text="${placesOccupees}">0</strong></div></div>
        <div class="col-md-3"><div class="alert alert-warning mb-0">Réservées: <strong th:text="${placesReservees}">0</strong></div></div>
        <div class="col-md-3"><div class="alert alert-secondary mb-0">Hors service: <strong th:text="${placesHorsService}">0</strong></div></div>
    </div>
    <div>
        <div th:each="place : ${toutesLesPlaces}" class="place-cell"
             th:classappend="${place.statut.name() == 'LIBRE'} ? 'libre' : (${place.statut.name() == 'OCCUPEE'} ? 'occupee' : (${place.statut.name() == 'RESERVEE'} ? 'reservee' : 'hors-service'))">
            <span th:text="${place.numero}"></span><small th:text="${place.type}"></small>
        </div>
    </div>
</div>
</body>
</html>
