<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-map-marker-alt"></i> Places</h2>
        <div><a th:href="@{/places/plan}" class="btn btn-info"><i class="fas fa-th"></i> Plan</a> <a th:href="@{/places/nouveau}" class="btn btn-primary"><i class="fas fa-plus"></i> Nouvelle place</a></div>
    </div>
    <div class="card mb-4"><div class="card-body">
        <form th:action="@{/places}" method="get" class="row g-3">
            <div class="col-md-2"><input type="text" class="form-control" name="numero" th:value="${numero}" placeholder="Numéro"></div>
            <div class="col-md-2"><input type="text" class="form-control" name="zone" th:value="${zone}" placeholder="Zone"></div>
            <div class="col-md-2"><select class="form-select" name="type"><option value="">Tous types</option><option th:each="t : ${typesPlace}" th:value="${t}" th:text="${t}" th:selected="${t == typeFiltre}"></option></select></div>
            <div class="col-md-2"><select class="form-select" name="statut"><option value="">Tous statuts</option><option th:each="s : ${statutsPlace}" th:value="${s}" th:text="${s}" th:selected="${s == statutFiltre}"></option></select></div>
            <div class="col-md-2"><button type="submit" class="btn btn-outline-primary w-100"><i class="fas fa-search"></i> Filtrer</button></div>
        </form>
    </div></div>
    <div class="card"><div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr><th>N°</th><th>Zone</th><th>Type</th><th>Statut</th><th>Actions</th></tr></thead>
                <tbody>
                    <tr th:each="p : ${places.content}">
                        <td th:text="${p.numero}"></td><td th:text="${p.zone}"></td>
                        <td><span class="badge bg-info" th:text="${p.type}"></span></td>
                        <td><span class="badge" th:text="${p.statut}" th:classappend="${p.statut.name() == 'LIBRE'} ? 'bg-success' : (${p.statut.name() == 'OCCUPEE'} ? 'bg-danger' : (${p.statut.name() == 'RESERVEE'} ? 'bg-warning' : 'bg-secondary'))"></span></td>
                        <td>
                            <a th:href="@{/places/modifier/{id}(id=${p.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/places/supprimer/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Supprimer ?')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${places.content.isEmpty()}"><td colspan="5" class="text-center text-muted">Aucune place</td></tr>
                </tbody>
            </table>
        </div>
        <nav th:if="${totalPages > 1}"><ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/places(page=${currentPage - 1})}">Précédent</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/places(page=${i})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/places(page=${currentPage + 1})}">Suivant</a></li>
        </ul></nav>
    </div></div>
</div>
</body>
</html>
