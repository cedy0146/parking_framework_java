<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-calendar-check"></i> Réservations</h2>
        <a th:href="@{/reservations/nouveau}" class="btn btn-primary"><i class="fas fa-plus"></i> Nouvelle réservation</a>
    </div>
    <div class="card mb-4"><div class="card-body">
        <form th:action="@{/reservations}" method="get" class="row g-3">
            <div class="col-md-3"><select class="form-select" name="statut"><option value="">Tous statuts</option><option th:each="s : ${statutsReservation}" th:value="${s}" th:text="${s}" th:selected="${s == statutFiltre}"></option></select></div>
            <div class="col-md-2"><button type="submit" class="btn btn-outline-primary w-100"><i class="fas fa-search"></i> Filtrer</button></div>
        </form>
    </div></div>
    <div class="card"><div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr>
                    <th>ID</th>
                    <th th:if="${!estUSER}">Utilisateur</th>
                    <th>Véhicule</th><th>Place</th><th>Arrivée</th><th>Départ</th><th>Statut</th><th>Actions</th>
                </tr></thead>
                <tbody>
                    <tr th:each="r : ${reservations.content}">
                        <td th:text="${r.id}"></td>
                        <td th:if="${!estUSER}" th:text="${r.utilisateurNom}"></td>
                        <td th:text="${r.vehiculeImmatriculation}"></td>
                        <td th:text="${r.placeNumero} ?: '-'"></td>
                        <td th:text="${#temporals.format(r.dateHeureArriveePrevue, 'dd/MM HH:mm')}"></td>
                        <td th:text="${#temporals.format(r.dateHeureDepartPrevue, 'dd/MM HH:mm')}"></td>
                        <td><span class="badge" th:text="${r.statut}" th:classappend="${r.statut.name() == 'CONFIRMEE'} ? 'bg-success' : (${r.statut.name() == 'EN_ATTENTE'} ? 'bg-warning' : (${r.statut.name() == 'ANNULEE'} ? 'bg-danger' : 'bg-secondary'))"></span></td>
                        <td>
                            <a th:if="${r.statut.name() == 'EN_ATTENTE'}" th:href="@{/reservations/confirmer/{id}(id=${r.id})}" class="btn btn-sm btn-success"><i class="fas fa-check"></i></a>
                            <a th:if="${r.statut.name() != 'ANNULEE' and r.statut.name() != 'TERMINEE'}" th:href="@{/reservations/annuler/{id}(id=${r.id})}" class="btn btn-sm btn-danger"><i class="fas fa-times"></i></a>
                            <a th:if="${r.statut.name() == 'CONFIRMEE'}" th:href="@{/reservations/terminer/{id}(id=${r.id})}" class="btn btn-sm btn-info"><i class="fas fa-flag-checkered"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${reservations.content.isEmpty()}"><td colspan="8" class="text-center text-muted">Aucune réservation</td></tr>
                </tbody>
            </table>
        </div>
        <nav th:if="${totalPages > 1}"><ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/reservations(page=${currentPage - 1})}">Précédent</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/reservations(page=${i})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/reservations(page=${currentPage + 1})}">Suivant</a></li>
        </ul></nav>
    </div></div>
</div>
</body>
</html>
