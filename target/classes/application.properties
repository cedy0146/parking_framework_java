spring.application.name=parking

# Serveur
server.port=8080

# Base de données H2 (fichier : les données persistent entre les redémarrages)
spring.datasource.url=jdbc:h2:file:./data/parkingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Messages d'erreur
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Logging
logging.level.com.tpe.parking=DEBUG
logging.level.org.springframework.security=DEBUG

# Dev : servir templates + static directement depuis src (pas besoin de recompiler)
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.thymeleaf.prefix=file:src/main/resources/templates/
