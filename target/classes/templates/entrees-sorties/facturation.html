<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent" class="page-enter">

    <header class="page-header">
        <div>
            <p class="page-eyebrow">Entrées / Sorties</p>
            <h1 class="page-title">Facturation</h1>
            <p class="page-subtitle">Détail du calcul et montant à payer.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/entrees-sorties}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>Retour
            </a>
        </div>
    </header>

    <section class="card" th:if="${tarification}">
        <div class="card-header d-flex align-items-center gap-2">
            <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
            <h2 class="panel-title mb-0">Détail facturation</h2>
        </div>
        <div class="card-body">
            <div class="row g-4">
                <div class="col-md-7">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <tbody>
                                <tr><th scope="row">Véhicule</th><td class="cell-strong" th:text="${tarification.vehiculeImmatriculation}"></td></tr>
                                <tr><th scope="row">Place</th><td th:text="${tarification.placeNumero}"></td></tr>
                                <tr><th scope="row">Durée</th><td th:text="${tarification.dureeFormatee}"></td></tr>
                                <tr><th scope="row">Tarif horaire</th><td th:text="${@labels.montant(tarification.tarifHoraire)}"></td></tr>
                                <tr>
                                    <th scope="row">Abonné</th>
                                    <td><span class="badge" th:text="${tarification.aAbonnement ? 'Oui (-20%)' : 'Non'}" th:classappend="${tarification.aAbonnement} ? 'bg-success' : 'bg-secondary'"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="card bg-light h-100">
                        <div class="card-body text-center d-flex flex-column justify-content-center">
                            <p class="panel-subtitle mb-3" th:text="${tarification.detailsCalcul}"></p>
                            <p class="metric-label mb-1">Montant à payer</p>
                            <p class="metric-value text-primary">
                                <i class="bi bi-cash-coin" aria-hidden="true"></i>
                                <span th:text="${@labels.montant(tarification.montantTotal)}"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <a th:href="@{/entrees-sorties}" class="btn btn-secondary">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>Retour
            </a>
        </div>
    </section>

</div>
</body>
</html>
