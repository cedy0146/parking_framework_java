<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent" class="page-enter">

    <header class="page-header">
        <div>
            <p class="page-eyebrow">Gestion</p>
            <h1 class="page-title">Entrées / <span class="hl">Sorties<svg class="hl-mark" viewBox="0 0 260 70" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="130" cy="35" rx="124" ry="30"></ellipse></svg></span></h1>
            <p class="page-subtitle">Les mouvements des véhicules et les stationnements en cours.</p>
        </div>
        <div class="page-actions">
            <span class="badge bg-danger align-self-center"><i class="bi bi-car-front me-1" aria-hidden="true"></i><span th:text="${nbEnCours}">0</span> stationnés</span>
            <a th:href="@{/entrees-sorties/nouveau}" class="btn btn-success" data-crud-open data-crud-title="Enregistrer une entrée">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>Nouvelle entrée
            </a>
        </div>
    </header>

    <!-- Filtres -->
    <section class="filter-bar" aria-label="Filtrer les entrées et sorties">
        <form th:action="@{/entrees-sorties}" method="get" class="row g-3 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label" for="filtre-enCours">État</label>
                <select class="form-select" id="filtre-enCours" name="enCours">
                    <option value="">Tous</option>
                    <option value="true" th:selected="${enCoursFiltre == true}">En stationnement</option>
                    <option value="false" th:selected="${enCoursFiltre == false}">Terminées</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-search" aria-hidden="true"></i>Filtrer
                </button>
            </div>
        </form>
    </section>

    <!-- Liste -->
    <section class="card" aria-label="Liste des entrées et sorties">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Véhicule</th>
                            <th scope="col">Place</th>
                            <th scope="col">Entrée</th>
                            <th scope="col">Sortie</th>
                            <th scope="col">Durée</th>
                            <th scope="col">Montant</th>
                            <th scope="col">Statut</th>
                            <th scope="col" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${entreesSorties.content}">
                            <td class="cell-muted" th:text="${e.id}"></td>
                            <td class="cell-strong" th:text="${e.vehiculeImmatriculation}"></td>
                            <td th:text="${e.placeNumero}"></td>
                            <td th:text="${@labels.dateCourte(e.dateHeureEntree)}"></td>
                            <td th:text="${e.dateHeureSortie != null ? @labels.dateCourte(e.dateHeureSortie) : '—'}"></td>
                            <td th:text="${e.dureeFormatee ?: '—'}"></td>
                            <td th:text="${@labels.montant(e.montantPaye)}"></td>
                            <td>
                                <span class="badge" th:text="${e.enCours ? 'En cours' : 'Terminé'}"
                                      th:classappend="${e.enCours} ? 'bg-warning' : 'bg-success'"></span>
                            </td>
                            <td class="text-end">
                                <div class="row-actions" aria-label="Actions sur le mouvement">
                                    <form th:if="${e.enCours}" th:action="@{/entrees-sorties/sortie/{vehiculeId}(vehiculeId=${e.vehiculeId})}" method="post" class="d-inline" data-crud-confirm="Enregistrer la sortie de ce véhicule ?">
                                        <button type="submit" class="btn btn-sm btn-danger" aria-label="Enregistrer la sortie" title="Enregistrer la sortie">
                                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                                        </button>
                                    </form>
                                    <a th:if="${!e.enCours}" th:href="@{/entrees-sorties/facturation/{id}(id=${e.id})}" class="btn btn-sm btn-info" aria-label="Voir la facturation" title="Facturation" data-crud-report>
                                        <i class="bi bi-receipt" aria-hidden="true"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${entreesSorties.content.isEmpty()}">
                            <td colspan="9" class="table-empty">Aucune entrée / sortie.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}" class="p-3" aria-label="Pagination des entrées et sorties">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/entrees-sorties(page=${currentPage - 1})}">Précédent</a></li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/entrees-sorties(page=${i})}" th:text="${i + 1}"></a></li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/entrees-sorties(page=${currentPage + 1})}">Suivant</a></li>
                </ul>
            </nav>
        </div>
    </section>

</div>
</body>
</html>
