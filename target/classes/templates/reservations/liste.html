<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent" class="page-enter">

    <header class="page-header">
        <div>
            <p class="page-eyebrow">Gestion</p>
            <h1 class="page-title"><span class="hl">Réservations<svg class="hl-mark" viewBox="0 0 260 70" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="130" cy="35" rx="124" ry="30"></ellipse></svg></span></h1>
            <p class="page-subtitle">Suivez les réservations, confirmez-les ou annulez-les.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/reservations/nouveau}" class="btn btn-primary" data-crud-open data-crud-title="Nouvelle réservation">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>Nouvelle réservation
            </a>
        </div>
    </header>

    <!-- Filtres -->
    <section class="filter-bar" aria-label="Filtrer les réservations">
        <form th:action="@{/reservations}" method="get" class="row g-3 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label" for="filtre-statut">Statut</label>
                <select class="form-select" id="filtre-statut" name="statut">
                    <option value="">Tous statuts</option>
                    <option th:each="s : ${statutsReservation}" th:value="${s}" th:text="${@labels.reservation(s)}" th:selected="${s == statutFiltre}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-search" aria-hidden="true"></i>Filtrer
                </button>
            </div>
        </form>
    </section>

    <!-- Liste -->
    <section class="card" aria-label="Liste des réservations">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col" th:if="${!estUSER}">Utilisateur</th>
                            <th scope="col">Véhicule</th>
                            <th scope="col">Place</th>
                            <th scope="col">Arrivée</th>
                            <th scope="col">Départ</th>
                            <th scope="col">Statut</th>
                            <th scope="col" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reservations.content}">
                            <td class="cell-muted" th:text="${r.id}"></td>
                            <td th:if="${!estUSER}" th:text="${r.utilisateurNom}"></td>
                            <td class="cell-strong" th:text="${r.vehiculeImmatriculation}"></td>
                            <td th:text="${r.placeNumero} ?: '-'"></td>
                            <td th:text="${@labels.dateCourte(r.dateHeureArriveePrevue)}"></td>
                            <td th:text="${@labels.dateCourte(r.dateHeureDepartPrevue)}"></td>
                            <td>
                                <span class="badge" th:text="${@labels.reservation(r.statut)}"
                                      th:classappend="${@labels.reservationCss(r.statut)}">Confirmée</span>
                            </td>
                            <td class="text-end">
                                <div class="row-actions" aria-label="Actions sur la réservation">
                                    <form th:if="${r.statut.name() == 'EN_ATTENTE'}" th:action="@{/reservations/confirmer/{id}(id=${r.id})}" method="post" class="d-inline" data-crud-confirm="Confirmer cette réservation ?">
                                        <button type="submit" class="btn btn-sm btn-success" aria-label="Confirmer la réservation" title="Confirmer">
                                            <i class="bi bi-check-lg" aria-hidden="true"></i>
                                        </button>
                                    </form>
                                    <form th:if="${r.statut.name() != 'ANNULEE' and r.statut.name() != 'TERMINEE'}" th:action="@{/reservations/annuler/{id}(id=${r.id})}" method="post" class="d-inline" data-crud-confirm="Annuler cette réservation ?">
                                        <button type="submit" class="btn btn-sm btn-danger" aria-label="Annuler la réservation" title="Annuler">
                                            <i class="bi bi-x-lg" aria-hidden="true"></i>
                                        </button>
                                    </form>
                                    <form th:if="${r.statut.name() == 'CONFIRMEE'}" th:action="@{/reservations/terminer/{id}(id=${r.id})}" method="post" class="d-inline" data-crud-confirm="Terminer cette réservation ?">
                                        <button type="submit" class="btn btn-sm btn-info" aria-label="Terminer la réservation" title="Terminer">
                                            <i class="bi bi-flag-fill" aria-hidden="true"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${reservations.content.isEmpty()}">
                            <td colspan="8" class="table-empty">Aucune réservation.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}" class="p-3" aria-label="Pagination des réservations">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/reservations(page=${currentPage - 1})}">Précédent</a></li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/reservations(page=${i})}" th:text="${i + 1}"></a></li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/reservations(page=${currentPage + 1})}">Suivant</a></li>
                </ul>
            </nav>
        </div>
    </section>

</div>
</body>
</html>
