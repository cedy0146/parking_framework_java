<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<head><style>
    .place-cell { width: 90px; height: 90px; border-radius: 8px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; margin: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .libre { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; }
</style></head>
<body>
<div th:fragment="pageContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-check-circle"></i> Places disponibles</h2>
        <a th:href="@{/reservations/nouveau}" class="btn btn-primary"><i class="fas fa-calendar-plus"></i> Réserver une place</a>
    </div>

    <div th:if="${#lists.isEmpty(placesDisponibles)}" class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> Aucune place disponible pour le moment.
    </div>

    <div>
        <div th:each="place : ${placesDisponibles}" class="place-cell libre">
            <span th:text="${place.numero}"></span>
            <small th:text="${place.type}"></small>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/abonnements/mon-abonnement}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Retour
        </a>
    </div>
</div>
</body>
</html>
