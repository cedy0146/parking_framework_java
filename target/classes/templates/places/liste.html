<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent" class="page-enter">

    <header class="page-header">
        <div>
            <p class="page-eyebrow">Gestion</p>
            <h1 class="page-title"><span class="hl">Places<svg class="hl-mark" viewBox="0 0 260 70" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="130" cy="35" rx="124" ry="30"></ellipse></svg></span></h1>
            <p class="page-subtitle">Toutes les places de stationnement, leur zone et leur statut.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/places/plan}" class="btn btn-outline-primary">
                <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i>Plan
            </a>
            <a th:href="@{/places/nouveau}" class="btn btn-primary" data-crud-open data-crud-title="Nouvelle place">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>Nouvelle place
            </a>
        </div>
    </header>

    <!-- Filtres -->
    <section class="filter-bar" aria-label="Filtrer les places">
        <form th:action="@{/places}" method="get" class="row g-3 align-items-end">
            <div class="col-6 col-md-2">
                <label class="form-label" for="filtre-numero">Numéro</label>
                <input type="text" class="form-control" id="filtre-numero" name="numero" th:value="${numero}" placeholder="A01">
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="filtre-zone">Zone</label>
                <input type="text" class="form-control" id="filtre-zone" name="zone" th:value="${zone}" placeholder="A">
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="filtre-type">Type</label>
                <select class="form-select" id="filtre-type" name="type">
                    <option value="">Tous types</option>
                    <option th:each="t : ${typesPlace}" th:value="${t}" th:text="${@labels.typePlace(t)}" th:selected="${t == typeFiltre}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="filtre-statut">Statut</label>
                <select class="form-select" id="filtre-statut" name="statut">
                    <option value="">Tous statuts</option>
                    <option th:each="s : ${statutsPlace}" th:value="${s}" th:text="${@labels.place(s)}" th:selected="${s == statutFiltre}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-search" aria-hidden="true"></i>Filtrer
                </button>
            </div>
        </form>
    </section>

    <!-- Liste -->
    <section class="card" aria-label="Liste des places">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">N°</th>
                            <th scope="col">Zone</th>
                            <th scope="col">Type</th>
                            <th scope="col">Statut</th>
                            <th scope="col" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${places.content}">
                            <td class="cell-strong" th:text="${p.numero}"></td>
                            <td th:text="${@labels.zone(p.zone)}"></td>
                            <td><span class="badge bg-info" th:text="${@labels.typePlace(p.type)}"></span></td>
                            <td>
                                <span class="badge" th:text="${@labels.place(p.statut)}"
                                      th:classappend="${@labels.placeCss(p.statut.name())}">Libre</span>
                            </td>
                            <td class="text-end">
                                <div class="row-actions" aria-label="Actions sur la place">
                                    <a th:href="@{/places/modifier/{id}(id=${p.id})}" class="icon-btn" aria-label="Modifier la place" title="Modifier" data-crud-open data-crud-title="Modifier la place">
                                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                                    </a>
                                    <form th:action="@{/places/supprimer/{id}(id=${p.id})}" method="post" class="d-inline" data-crud-confirm="Supprimer définitivement cette place ?">
                                        <button type="submit" class="icon-btn icon-btn--danger" aria-label="Supprimer la place" title="Supprimer">
                                            <i class="bi bi-trash3" aria-hidden="true"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${places.content.isEmpty()}">
                            <td colspan="5" class="table-empty">Aucune place ne correspond à votre recherche.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}" class="p-3" aria-label="Pagination des places">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/places(page=${currentPage - 1})}">Précédent</a></li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/places(page=${i})}" th:text="${i + 1}"></a></li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/places(page=${currentPage + 1})}">Suivant</a></li>
                </ul>
            </nav>
        </div>
    </section>

</div>
</body>
</html>
