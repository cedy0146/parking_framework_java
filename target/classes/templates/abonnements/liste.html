<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent" class="page-enter">

    <header class="page-header">
        <div>
            <p class="page-eyebrow">Gestion</p>
            <h1 class="page-title"><span class="hl">Abonnements<svg class="hl-mark" viewBox="0 0 260 70" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="130" cy="35" rx="124" ry="30"></ellipse></svg></span></h1>
            <p class="page-subtitle">Les abonnements souscrits, leur période et leur statut.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/abonnements/nouveau}" class="btn btn-primary" data-crud-open data-crud-title="Nouvel abonnement">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>Nouvel abonnement
            </a>
        </div>
    </header>

    <!-- Filtres -->
    <section class="filter-bar" aria-label="Filtrer les abonnements">
        <form th:action="@{/abonnements}" method="get" class="row g-3 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label" for="filtre-statut">Statut</label>
                <select class="form-select" id="filtre-statut" name="statut">
                    <option value="">Tous statuts</option>
                    <option th:each="s : ${statutsAbonnement}" th:value="${s}" th:text="${@labels.abonnement(s)}" th:selected="${s == statutFiltre}"></option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="filtre-type">Type</label>
                <select class="form-select" id="filtre-type" name="type">
                    <option value="">Tous types</option>
                    <option th:each="t : ${typesAbonnement}" th:value="${t}" th:text="${@labels.typeAbonnement(t)}" th:selected="${t == typeFiltre}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-search" aria-hidden="true"></i>Filtrer
                </button>
            </div>
        </form>
    </section>

    <!-- Liste -->
    <section class="card" aria-label="Liste des abonnements">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Utilisateur</th>
                            <th scope="col">Véhicule</th>
                            <th scope="col">Type</th>
                            <th scope="col">Début</th>
                            <th scope="col">Fin</th>
                            <th scope="col">Prix</th>
                            <th scope="col">Statut</th>
                            <th scope="col" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${abonnements.content}">
                            <td class="cell-muted" th:text="${a.id}"></td>
                            <td th:text="${a.utilisateurNom}"></td>
                            <td class="cell-strong" th:text="${a.vehiculeImmatriculation}"></td>
                            <td><span class="badge bg-primary" th:text="${@labels.typeAbonnement(a.type)}"></span></td>
                            <td th:text="${@labels.date(a.dateDebut)}"></td>
                            <td th:text="${@labels.date(a.dateFin)}"></td>
                            <td th:text="${@labels.montant(a.prix)}"></td>
                            <td>
                                <span class="badge" th:text="${@labels.abonnement(a.statut)}"
                                      th:classappend="${@labels.abonnementCss(a.statut)}">Actif</span>
                            </td>
                            <td class="text-end">
                                <div class="row-actions" aria-label="Actions sur l'abonnement">
                                    <form th:if="${a.statut.name() == 'ACTIF'}" th:action="@{/abonnements/resilier/{id}(id=${a.id})}" method="post" class="d-inline" data-crud-confirm="Résilier cet abonnement ?">
                                        <button type="submit" class="btn btn-sm btn-danger" aria-label="Résilier l'abonnement" title="Résilier">
                                            <i class="bi bi-ban" aria-hidden="true"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${abonnements.content.isEmpty()}">
                            <td colspan="9" class="table-empty">Aucun abonnement.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}" class="p-3" aria-label="Pagination des abonnements">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/abonnements(page=${currentPage - 1})}">Précédent</a></li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/abonnements(page=${i})}" th:text="${i + 1}"></a></li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/abonnements(page=${currentPage + 1})}">Suivant</a></li>
                </ul>
            </nav>
        </div>
    </section>

</div>
</body>
</html>
