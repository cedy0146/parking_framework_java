<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent" class="page-enter">

    <header class="page-header">
        <div>
            <p class="page-eyebrow">Mon espace</p>
            <h1 class="page-title">Mon <span class="hl">abonnement<svg class="hl-mark" viewBox="0 0 260 70" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="130" cy="35" rx="124" ry="30"></ellipse></svg></span></h1>
            <p class="page-subtitle">Le détail de vos abonnements en cours.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/places/disponibles-consultation}" class="btn btn-outline-primary">
                <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i>Voir les places disponibles
            </a>
        </div>
    </header>

    <div th:if="${#lists.isEmpty(abonnements)}" class="alert alert-info" role="status">
        <i class="bi bi-info-circle me-2" aria-hidden="true"></i>Vous n'avez aucun abonnement en cours.
    </div>

    <div th:each="a : ${abonnements}" class="card mb-3">
        <div class="card-body">
            <div class="row align-items-center g-3">
                <div class="col-md-6">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <span class="badge bg-primary" th:text="${@labels.typeAbonnement(a.type)}"></span>
                        <span class="badge" th:text="${@labels.abonnement(a.statut)}"
                              th:classappend="${@labels.abonnementCss(a.statut)}">Actif</span>
                    </div>
                    <p class="mb-1"><strong>Véhicule :</strong> <span th:text="${a.vehiculeImmatriculation}"></span></p>
                    <p class="mb-1"><strong>Début :</strong> <span th:text="${@labels.date(a.dateDebut)}"></span></p>
                    <p class="mb-0"><strong>Fin :</strong> <span th:text="${@labels.date(a.dateFin)}"></span></p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="metric-label mb-1">Prix payé</p>
                    <p class="metric-value" th:text="${@labels.montant(a.prix)}">—</p>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
