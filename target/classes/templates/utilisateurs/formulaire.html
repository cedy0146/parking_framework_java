<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent" class="page-enter">

    <header class="page-header">
        <div>
            <p class="page-eyebrow">Administration</p>
            <h1 class="page-title"><span th:text="${id != null ? 'Modifier l’utilisateur' : 'Nouvel utilisateur'}"></span></h1>
            <p class="page-subtitle">Identité, coordonnées, mot de passe et rôle.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/utilisateurs}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>Retour à la liste
            </a>
        </div>
    </header>

    <section class="card">
        <div class="card-body">
            <form th:fragment="formContent" th:action="${id != null} ? @{/utilisateurs/modifier/{id}(id=${id})} : @{/utilisateurs/sauvegarder}" th:object="${utilisateur}" method="post" class="row g-3">
                <div class="col-12 alert alert-danger form-error-summary" role="alert" th:if="${#fields.hasAnyErrors()}">
                    <strong>Veuillez corriger les champs signalés ci-dessous.</strong>
                    <ul>
                        <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                    </ul>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="nom">Nom *</label>
                    <input type="text" class="form-control" id="nom" th:field="*{nom}" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                    <div class="invalid-feedback" role="alert" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="prenom">Prénom *</label>
                    <input type="text" class="form-control" id="prenom" th:field="*{prenom}" th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'">
                    <div class="invalid-feedback" role="alert" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="email">Email *</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="nom@exemple.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" role="alert" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="telephone">Téléphone</label>
                    <input type="text" class="form-control" id="telephone" th:field="*{telephone}" placeholder="06 00 00 00 00">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="motDePasse">Mot de passe *</label>
                    <input type="password" class="form-control" id="motDePasse" th:field="*{motDePasse}" autocomplete="new-password" th:placeholder="${id != null ? 'Laisser vide pour ne pas changer' : ''}" th:classappend="${#fields.hasErrors('motDePasse')} ? 'is-invalid'">
                    <div class="invalid-feedback" role="alert" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="role">Rôle *</label>
                    <select class="form-select" id="role" th:field="*{role}" th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                    <div class="invalid-feedback" role="alert" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                </div>
                <div class="col-12 form-actions">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-floppy" aria-hidden="true"></i>Enregistrer</button>
                    <a th:href="@{/utilisateurs}" class="btn btn-secondary"><i class="bi bi-arrow-left" aria-hidden="true"></i>Annuler</a>
                </div>
            </form>
        </div>
    </section>

</div>
</body>
</html>
