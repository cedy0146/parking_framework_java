<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: html}">
<body>
<div th:fragment="pageContent">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-users"></i> Utilisateurs</h2>
        <a th:href="@{/utilisateurs/nouveau}" class="btn btn-primary"><i class="fas fa-plus"></i> Nouvel utilisateur</a>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/utilisateurs}" method="get" class="row g-3">
                <div class="col-md-4"><input type="text" class="form-control" name="nom" th:value="${nom}" placeholder="Rechercher par nom..."></div>
                <div class="col-md-3">
                    <select class="form-select" name="role">
                        <option value="">Tous les rôles</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == role}"></option>
                    </select>
                </div>
                <div class="col-md-2"><button type="submit" class="btn btn-outline-primary w-100"><i class="fas fa-search"></i> Filtrer</button></div>
            </form>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead><tr><th>ID</th><th>Nom</th><th>Prénom</th><th>Email</th><th>Téléphone</th><th>Rôle</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="u : ${utilisateurs.content}">
                            <td th:text="${u.id}"></td><td th:text="${u.nom}"></td><td th:text="${u.prenom}"></td>
                            <td th:text="${u.email}"></td><td th:text="${u.telephone}"></td>
                            <td><span class="badge bg-secondary" th:text="${u.role}"></span></td>
                            <td><div class="d-inline-flex gap-3" aria-label="Actions sur l'utilisateur"><a th:href="@{/utilisateurs/modifier/{id}(id=${u.id})}" class="link-primary text-decoration-none" aria-label="Modifier" title="Modifier"><i class="bi bi-pencil-square" aria-hidden="true"></i></a><a th:href="@{/utilisateurs/supprimer/{id}(id=${u.id})}" class="link-danger text-decoration-none" onclick="return confirm('Supprimer ?')" aria-label="Supprimer" title="Supprimer"><i class="bi bi-trash3" aria-hidden="true"></i></a></div></td>
                        </tr>
                        <tr th:if="${utilisateurs.content.isEmpty()}"><td colspan="7" class="text-center text-muted">Aucun utilisateur trouvé</td></tr>
                    </tbody>
                </table>
            </div>
            <nav th:if="${totalPages > 1}"><ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link" th:href="@{/utilisateurs(page=${currentPage - 1}, nom=${nom}, role=${role})}">Précédent</a></li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/utilisateurs(page=${i}, nom=${nom}, role=${role})}" th:text="${i + 1}"></a></li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link" th:href="@{/utilisateurs(page=${currentPage + 1}, nom=${nom}, role=${role})}">Suivant</a></li>
            </ul></nav>
        </div>
    </div>
</div>
</body>
</html>
